[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-crime-scene"
version = "0.3.0"
description = "Laboratorio local para investigar tres errores de evaluación en machine learning"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "streamlit",
  "plotly",
]

[project.optional-dependencies]
test = ["pytest"]
browser = ["playwright"]

[tool.setuptools.packages.find]
include = ["data_crime_scene*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
